# --- Machine and Distro Configuration ---
MACHINE ?= "beaglebone-yocto"
IMAGE_BOOT_FILES ?= "u-boot.img MLO zImage am335x-boneblack.dtb"
EXTRA_IMAGEDEPENDS += "virtual/bootloader"
DISTRO ?= "poky"

# --- Bootloader and Kernel Configuration ---
#PREFERRED_PROVIDER_virtual/bootloader = "u-boot-ti-staging"
# Ensure kernel supports Wi-Fi stack and netfilter for internet
KERNEL_FEATURES:append = " features/netfilter/netfilter.scc"
KERNEL_CC = "gcc"
HOSTCC = "gcc"

# --- Build Environment Paths ---
DL_DIR ?= "${TOPDIR}/../downloads"
SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"
TMPDIR ?= "${TOPDIR}/tmp"
DEPLOY_DIR_IMAGE = "/home/debu/my-images"

# --- Hardware Acceleration ---
BB_NUMBER_THREADS ?= "12"
PARALLEL_MAKE ?= "-j12"

# --- Image Features (Security & Management) ---
# 1. Remove Passwords and Enable Debug Access
IMAGE_FEATURES += "allow-empty-password empty-root-password debug-tweaks"
IMAGE_FEATURES += "package-management ssh-server-openssh tools-sdk tools-debug dev-pkgs"

# 2. Force empty password for root via ExtraUsers
INHERIT += "extrausers"
EXTRA_USERS_PARAMS = "usermod -p '' root;"

# 3. Enable Systemd (Required for modern NetworkManager/FOTA)
DISTRO_FEATURES:append = " systemd usrmerge wifi rauc"
VIRTUAL-RUNTIME_init_manager = "systemd"
DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

# --- FOTA & Partitioning (A/B Scheme) ---
# Uses the dual-boot.wks file located in your meta-custom/wic/ directory
WKS_FILE = "dual-boot.wks"
IMAGE_FSTYPES += "wic wic.bmap"

# --- Package Installation ---
PACKAGE_CLASSES = "package_ipk"

IMAGE_INSTALL:append = " \
    base-files \
    opkg opkg-utils \
    openssh openssh-sshd \
    u-boot-fw-utils \
    rauc \
    util-linux-mount \
    libubootenv-bin \
"

# Wi-Fi and Internet Tools
IMAGE_INSTALL:append = " \
    networkmanager \
    networkmanager-nmcli \
    iw \
    wpa-supplicant \
    linux-firmware-rtl8192cu \
    linux-firmware-ralink \
    linux-firmware-ath9k \
    linux-firmware-rtl8188 \
    ethtool \
    net-tools \
    usbutils \
"

# Development Tools & Custom Apps
IMAGE_INSTALL:append = " \
    gcc g++ make git nano vim pkgconfig \
    kernel-dev kernel-devsrc kernel-modules \
    python3 python3-pip \
    dosfstools \
    toggle myapp mytimer newlayer \
"

# --- Misc Settings ---
IMAGE_LINGUAS ?= "en-us en-gb"
SSTATE_ALLOW_OVERLAP_FILES += "quilt-native linux-bb.org"


# Remove the old 'rtl8188eu' that caused the error
IMAGE_INSTALL:append = " linux-firmware-rtl8188 networkmanager"

# Tell the kernel to load its built-in driver (r8188eu) automatically
KERNEL_MODULE_AUTOLOAD += "r8188eu"

# 3. Define the Boot Files to be copied to the FAT partition
#IMAGE_BOOT_FILES = "MLO u-boot.img zImage am335x-boneblack.dtb uEnv.txt"
IMAGE_BOOT_FILES:append = " MLO u-boot.img zImage am335x-boneblack.dtb uEnv.txt"

# 4. Add connectivity tools so you can actually use the Wi-Fi
IMAGE_INSTALL:append = " networkmanager"